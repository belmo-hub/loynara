name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  credential-storage:
    name: Credential storage checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/operator-secrets.test.py

  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            marketing-site/package-lock.json
      - run: npm ci
      # The root typecheck also covers marketing-site, which has its own dependencies.
      - run: npm ci --prefix marketing-site
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: looplocal_test
          POSTGRES_USER: looplocal
          POSTGRES_PASSWORD: looplocal_local_only
        # 54329 is the project's default test port; billing tests expect exactly this URL.
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U looplocal -d looplocal_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://looplocal:looplocal_local_only@localhost:54329/looplocal_test
      PGPASSWORD: looplocal_local_only
      BETTER_AUTH_URL: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      BILLING_FIXTURE_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release preflight tests inspect commit history, so a shallow copy is not enough.
          fetch-depth: 0
      - name: Install age (used by the backup and key-custody tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Create throwaway secrets for this run
        run: |
          for name in BETTER_AUTH_SECRET BILLING_FIXTURE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Prepare the test database
        run: |
          psql -h localhost -p 54329 -U looplocal -d looplocal_test -v ON_ERROR_STOP=1 -q -f drizzle/auth.sql
          npx drizzle-kit migrate
      # Same command `npm test` ends with. `npm test` itself starts a local Docker database, which CI already provides.
      #
      # These files are skipped because they are tied to one developer machine: they expect a Postgres in a specific
      # local folder or on port 55433, or they drive Docker Compose. They should be made portable so they can run here.
      - name: Run the test suite
        run: >-
          npx vitest run --hookTimeout 60000
          --exclude 'scripts/backup-publication.test.ts'
          --exclude 'scripts/preview-backup-publication.test.ts'
          --exclude 'src/lib/award-key-race.integration.test.ts'
          --exclude 'src/lib/redemption-key-race.integration.test.ts'
          --exclude 'src/lib/location-http-scope.integration.test.ts'
          --exclude 'src/lib/purchase-concurrent-release.integration.test.ts'
          --exclude 'src/lib/ten-merchant-release.integration.test.ts'
          --exclude 'src/lib/customer-export-active-loss.integration.test.ts'
