services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: looplocal_preview
      POSTGRES_USER: looplocal_preview
      POSTGRES_PASSWORD: looplocal_preview_local_only
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - preview_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looplocal_preview -d looplocal_preview"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  preview_pg:
