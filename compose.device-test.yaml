services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: looplocal_device_test
      POSTGRES_USER: looplocal_device
      POSTGRES_PASSWORD: ${DEVICE_TEST_DB_PASSWORD:?Prepare device-test secrets first}
    ports:
      - "127.0.0.1:54331:5432"
    volumes:
      - device_test_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looplocal_device -d looplocal_device_test"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  device_test_pg:
