services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: looplocal
      POSTGRES_USER: looplocal
      POSTGRES_PASSWORD: looplocal_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - looplocal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looplocal -d looplocal"]
      interval: 2s
      timeout: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  looplocal_pg:
